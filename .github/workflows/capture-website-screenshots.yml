name: Capture existing website page screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - sitewide-treatment-dropdown-20260918
    paths:
      - .github/workflows/capture-website-screenshots.yml

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render current site pages
        shell: bash
        run: |
          set -e
          python3 -m http.server 8765 --directory output/site-preview >/tmp/lienbang-preview.log 2>&1 &
          echo $! > /tmp/lienbang-server.pid
          sleep 2
          mkdir -p website-screenshots
          node <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const pages = {
              home: '/', services: '/services/', symptoms:'/symptoms/',
              team:'/team/', about:'/about-lienbang/',
              clinic:'/acupuncture/', pulse:'/pulse-diagnosis/',
              integration:'/acupuncture-physical-therapy/'
            };
            const logs = [];
            for(const [name,path] of Object.entries(pages)) {
              for(const [mode,viewport] of Object.entries({
                desktop:{width:1440,height:900},mobile:{width:390,height:844}
              })){
                const page = await browser.newPage({viewport,deviceScaleFactor:1});
                const errors = [];
                page.on('pageerror',e=>errors.push(e.message));
                const response = await page.goto('http://127.0.0.1:8765'+path,{waitUntil:'networkidle',timeout:45000});
                await page.evaluate(async()=>{
                  await document.fonts.ready;
                  await Promise.all(Array.from(document.images).map(img=>{
                    if(img.complete)return Promise.resolve();
                    return new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true});setTimeout(resolve,3500)});
                  }));
                });
                const screenshot = 'website-screenshots/'+name+'-'+mode+'.png';
                await page.screenshot({path:screenshot,fullPage:true,animations:'disabled'});
                logs.push({path,mode,httpStatus:response?.status(),screenshot,errors});
                await page.close();
              }
            }
            fs.writeFileSync('website-screenshots/manifest.json',JSON.stringify(logs,null,2));
            await browser.close();
            console.log(logs);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Upload original screenshots (not redesigns)
        uses: actions/upload-artifact@v4
        with:
          name: lienbang-current-pages-desktop-mobile
          path: website-screenshots/
          retention-days: 30
