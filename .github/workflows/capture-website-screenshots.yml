name: Capture current Lienbang website screenshots

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/capture-website-screenshots.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out actual development website
        uses: actions/checkout@v4
        with:
          ref: sitewide-treatment-dropdown-20260918
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture full existing pages
        shell: bash
        run: |
          python3 -m http.server 8765 --directory output/site-preview >/tmp/lienbang-preview.log 2>&1 &
          sleep 3
          mkdir -p website-screenshots
          node <<'JS'
          const {chromium} = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const paths = {
              home:'/',services:'/services/',symptoms:'/symptoms/',
              team:'/team/',about:'/about-lienbang/',
              acupuncture:'/acupuncture/',pulse:'/pulse-diagnosis/',
              integration:'/acupuncture-physical-therapy/'
            };
            const manifest=[];
            for(const [name,path] of Object.entries(paths)){
              for(const [mode,viewport] of Object.entries({
                desktop:{width:1440,height:900},mobile:{width:390,height:844}
              })){
                const page=await browser.newPage({viewport});
                const response=await page.goto('http://127.0.0.1:8765'+path,{waitUntil:'domcontentloaded',timeout:12000}).catch(e=>{console.warn(name,mode,e.message);return null});
                await page.waitForTimeout(1000);
                const dest='website-screenshots/'+name+'-'+mode+'.png';
                await page.screenshot({path:dest,fullPage:true,animations:'disabled',timeout:12000}).catch(e=>console.warn('screenshot failed',name,mode,e.message));
                manifest.push({path,mode,status:response?.status(),file:dest});
                await page.close();
              }
            }
            fs.writeFileSync('website-screenshots/manifest.json',JSON.stringify(manifest,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Upload screenshot package
        uses: actions/upload-artifact@v4
        with:
          name: existing-lienbang-website-screenshots
          path: website-screenshots
          retention-days: 30
